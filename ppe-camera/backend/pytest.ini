[pytest]
# The camera-persistence tests exercise async restore paths directly, so
# pytest-asyncio is required to run the suite. Declared here rather than left
# implicit: without it those tests are silently skipped as unrecognised
# markers, and a restart-persistence regression would go unnoticed.
asyncio_mode = strict
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
